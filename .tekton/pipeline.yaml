apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: "cluster-lunedi-provisioning"
  namespace: "bs-team-alpha-dev"
  labels:
    app.kubernetes.io/name: "cluster-lunedi"
    app.kubernetes.io/part-of: "cluster-lunedi"
    app.kubernetes.io/component: pipeline
    app.kubernetes.io/managed-by: backstage-scaffolder
    owner: so.amin
  annotations:
    tekton.dev/displayName: "EKS Cluster cluster-lunedi Provisioning Pipeline"
    tekton.dev/description: >-
      Provisions and manages AWS EKS Cluster cluster-lunedi through
      git-clone -> terraform-init-validate -> tfsec-security-scan -> terraform-plan -> terraform-apply.
spec:
  params:
    - name: repo-url
      type: string
      description: Target Git repository holding Terraform infrastructure code.
    - name: revision
      type: string
      default: main
      description: Git commit SHA, branch or tag.
    - name: cluster-name
      type: string
      default: "cluster-lunedi"
      description: Name of the EKS cluster.
    - name: aws-region
      type: string
      default: "eu-west-1"
      description: Target AWS region.
    - name: state-bucket
      type: string
      default: "so-amin-idp-terraform-backend"
      description: Platform remote state S3 bucket.
    - name: state-lock-table
      type: string
      default: "so-amin-idp-terraform-backend-lock-table"
      description: Platform state locking DynamoDB table.

  workspaces:
    - name: shared-data
      description: PersistentVolumeClaim storing repository workspace across tasks.

  results:
    - name: cluster-name
      description: Output name of the provisioned cluster.

      value: $(tasks.terraform-apply.results.cluster-name)
    - name: cluster-endpoint
      description: Output API server endpoint.
      value: $(tasks.terraform-apply.results.cluster-endpoint)
    - name: oidc-provider-arn
      description: IAM OIDC provider ARN for IRSA integrations.
      value: $(tasks.terraform-apply.results.oidc-provider-arn)


  tasks:
    # -------------------------------------------------------------------------
    # 1. Clone repository source code
    # -------------------------------------------------------------------------
    - name: git-clone
      taskSpec:
        params:
          - name: url
            type: string
          - name: revision
            type: string
        workspaces:
          - name: output

        steps:
          - name: clone
            image: alpine/git:2.45.2
            workingDir: $(workspaces.output.path)
            script: |
              #!/usr/bin/env sh
              set -eu
              git config --global --add safe.directory '*'
              echo "Cloning $(params.url) at revision $(params.revision)..."
              rm -rf ./* ./.[!.]*
              git init
              git remote add origin "$(params.url)"
              git fetch --depth 1 origin "$(params.revision)"
              git checkout -q FETCH_HEAD
              echo "Successfully checked out commit $(git rev-parse HEAD)"

      params:

        - name: url
          value: $(params.repo-url)
        - name: revision
          value: $(params.revision)

      workspaces:
        - name: output
          workspace: shared-data

    # -------------------------------------------------------------------------
    # 2. Terraform Init and Validate
    # -------------------------------------------------------------------------
    - name: terraform-init-validate
      runAfter:
        - git-clone
      taskRef:
        name: terraform-init-validate
      params:
        - name: terraform-dir
          value: "terraform"

        - name: aws-region
          value: $(params.aws-region)
        - name: state-bucket
          value: $(params.state-bucket)
        - name: state-lock-table
          value: $(params.state-lock-table)

      workspaces:
        - name: source
          workspace: shared-data

    # -------------------------------------------------------------------------
    # 3. Static Security Vulnerability Scan (tfsec)
    # -------------------------------------------------------------------------
    - name: tfsec-security-scan
      runAfter:
        - terraform-init-validate
      taskRef:
        name: tfsec-security-scan
      params:
        - name: terraform-dir
          value: "terraform"
      workspaces:
        - name: source
          workspace: shared-data

    # -------------------------------------------------------------------------
    # 4. Terraform Speculative Execution Plan
    # -------------------------------------------------------------------------
    - name: terraform-plan
      runAfter:
        - tfsec-security-scan
      taskRef:
        name: terraform-plan
      params:
        - name: terraform-dir
          value: "terraform"

        - name: aws-region
          value: $(params.aws-region)
        - name: state-bucket
          value: $(params.state-bucket)
        - name: state-lock-table
          value: $(params.state-lock-table)

      workspaces:
        - name: source
          workspace: shared-data

    # -------------------------------------------------------------------------
    # 5. Terraform Apply via OIDC IRSA Role
    # -------------------------------------------------------------------------
    - name: terraform-apply
      runAfter:
        - terraform-plan
      taskRef:
        name: terraform-apply
      params:
        - name: terraform-dir
          value: "terraform"

        - name: aws-region
          value: $(params.aws-region)
        - name: state-bucket
          value: $(params.state-bucket)
        - name: state-lock-table
          value: $(params.state-lock-table)

      workspaces:
        - name: source
          workspace: shared-data
