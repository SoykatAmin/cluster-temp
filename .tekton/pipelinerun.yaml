apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: "cluster-lunedi-provisioning-run-"
  namespace: "bs-team-alpha-dev"
  labels:
    tekton.dev/pipeline: "cluster-lunedi-provisioning"
    app.kubernetes.io/name: "cluster-lunedi"
    app.kubernetes.io/part-of: "cluster-lunedi"
    owner: so.amin
    janus-idp.io/tekton: "cluster-lunedi-provisioning"
spec:
  pipelineRef:
    name: "cluster-lunedi-provisioning"
  taskRunTemplate:
    serviceAccountName: tekton-pipeline
  params:
    - name: repo-url
      value: "https://github.com/SoykatAmin/cluster-lunedi.git"
    - name: revision
      value: main
    - name: cluster-name
      value: "cluster-lunedi"
    - name: aws-region
      value: "eu-west-1"
    - name: state-bucket
      value: "so-amin-idp-terraform-backend"
    - name: state-lock-table
      value: "so-amin-idp-terraform-backend-lock-table"
  workspaces:
    - name: shared-data
      volumeClaimTemplate:
        metadata:
          labels:
            owner: so.amin
            cluster: "cluster-lunedi"
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi
          storageClassName: gp3
